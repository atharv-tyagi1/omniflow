services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omniflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omniflow
      POSTGRES_USER: omniflow
      POSTGRES_PASSWORD: omniflow_dev_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniflow -d omniflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omniflow_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniflow_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://omniflow:omniflow_dev_2024@postgres:5432/omniflow
      - SYNC_DATABASE_URL=postgresql://omniflow:omniflow_dev_2024@postgres:5432/omniflow
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omniflow_network

volumes:
  postgres_data:
    driver: local

networks:
  omniflow_network:
    driver: bridge
